name: insof-eco
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: insof
      POSTGRES_PASSWORD: insof
      POSTGRES_DB: insof
    ports: ["5438:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insof"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6382:6379"]
    volumes: [redisdata:/data]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: insof
      MINIO_ROOT_PASSWORD: insofinsof
    ports: ["9010:9000", "9011:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  miniodata:
