name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: insof, POSTGRES_PASSWORD: insof, POSTGRES_DB: insof_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U insof" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @insof/shared build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn workspace @insof/api prisma:generate
      - run: yarn test
        env:
          DATABASE_URL: postgresql://insof:insof@localhost:5432/insof_test
          REDIS_URL: redis://localhost:6379
